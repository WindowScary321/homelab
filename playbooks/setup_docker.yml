- name: Docker install in homelab
  hosts: homelab
  become: true  # Chạy với quyền root

  vars_files:
    - ../vars/global.yml

  vars:
    # Docker repo dùng tên arch khác uname
    docker_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64', 'armv7l': 'armhf'}.get(ansible_architecture, ansible_architecture) }}"

  tasks:
    - name: 0. bootstrap python3-apt (apt module cần nó trước khi chạy)
      raw: dpkg -s python3-apt >/dev/null 2>&1 || (apt-get update -y && apt-get install -y python3-apt)
      changed_when: false

    - name: 1. update apt repository
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: 2. install depedency and extra stuffs
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - tmux
          - rclone
          - fastfetch
          - htop
          - ufw
          - smartmontools 
          - git
          - python3-requests
        state: present

    - name: 3. create keyrings folder
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: 4. download gpg from docker
      get_url:
        url: https://download.docker.com/linux/debian/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'
        force: true

    - name: 5. add repo to apt
      apt_repository:
        repo: "deb [arch={{ docker_arch }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable"
        state: present
        filename: docker
        
    - name: 6. install docker
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: 7. Start Docker service
      service:
        name: docker
        state: started
        enabled: yes

    - name: 8. add {{ homelab_user }} to docker groups
      user:
        name: "{{ homelab_user }}"
        groups: docker
        append: yes
