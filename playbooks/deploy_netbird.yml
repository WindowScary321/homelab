---
- name: Deploy Netbird Client through Docker
  hosts: homelab
  become: true
  
  vars_files:
    - ../vars/secrets.yml

  vars:
    base_dir: "/home/prouser/docker-data"
    peer_name: "homelab"

  tasks:
    - name: 1. Create Netbird directory
      file:
        path: "{{ base_dir }}/netbird"
        state: directory
        mode: '0700'
        owner: prouser
        group: prouser

    - name: 2. Download portainer image
      community.docker.docker_image:
        name: netbirdio/netbird:latest
        source: pull

    - name: 2. Start Netbird Container
      community.docker.docker_container:
        name: netbird-client
        image: netbirdio/netbird:latest
        state: started
        restart_policy: always
        hostname: "{{ peer_name }}"
        capabilities:
          - NET_ADMIN
          - SYS_ADMIN
          - SYS_RESOURCE
        env:
          # Sử dụng biến đã được giải mã từ file secrets.yml
          NB_SETUP_KEY: "{{ netbird_setup_key }}"
        volumes:
          - "{{ base_dir }}/netbird:/var/lib/netbird"
        network_mode: host