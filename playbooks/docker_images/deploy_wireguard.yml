---
- name: Deploy wireguard
  hosts: homelab
  become: true

  vars:
    base_dir: "/home/prouser/docker-data"
    container_state: started
    puid: "1000"
    pgid: "1000"
    timezone: "Asia/Ho_Chi_Minh"
    wireguard_port: "123" # né firewall của trường

  tasks:
    - name: Create WireGuard config
      file:
        path: "{{ base_dir }}/wireguard"
        state: directory
        mode: '0700'
        owner: prouser
        group: prouser

    - name: Download WireGuard image
      community.docker.docker_image:
        name: lscr.io/linuxserver/wireguard:latest
        source: pull

    - name: Start WireGuard Container
      community.docker.docker_container:
        name: wireguard
        image: lscr.io/linuxserver/wireguard:latest
        state: "{{ container_state }}"
        restart_policy: unless-stopped
        capabilities:
          - NET_ADMIN
          - SYS_MODULE
        sysctls:
          net.ipv4.conf.all.src_valid_mark: "1"
        env:
          PUID: "{{ puid }}"
          PGID: "{{ pgid }}"
          TZ: "{{ timezone }}"
          SERVERURL: "auto"
          SERVERPORT: "{{ wireguard_port }}" 
          PEERS: "phone,laptop"
          PEERDNS: "auto"
          INTERNAL_SUBNET: "10.13.13.0"
          ALLOWEDIPS: "0.0.0.0/0"
          LOG_CONFS: "true"
        ports:
          - "{{ wireguard_port }}:51820/udp"
        volumes:
          - "{{ base_dir }}/wireguard:/config"
          - "/lib/modules:/lib/modules"