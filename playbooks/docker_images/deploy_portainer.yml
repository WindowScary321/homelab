---
- name: Deploy portainer
  hosts: homelab
  become: true

  vars_files:
    - ../../vars/global.yml

  tasks:
    - name: Add docker base folder.
      file:
        path: "{{ base_dir }}"
        state: directory
        mode: '0755'
        owner: prouser 
        group: prouser

    - name: Add portainer data folder
      file:
        path: "{{ base_dir }}/portainer"
        state: directory
        mode: '0755'
        owner: prouser 
        group: prouser

    - name: Start portainer Container
      community.docker.docker_container:
        name: portainer
        image: portainer/portainer-ce:latest
        state: "{{ container_state }}"
        restart_policy: always
        pull: always # luôn pull image mới khi chạy playbook 
        recreate: true # luôn tạo container mới khi chạy playbook
        networks:
          - name: cloudflared_net # thêm mạng lan ảo mới
        ports:
           - 9443:9443
        volumes:
          - "/var/run/docker.sock:/var/run/docker.sock"
          - "{{ base_dir }}/portainer:/data"