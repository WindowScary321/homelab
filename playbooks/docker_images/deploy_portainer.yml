---
- name: Deploy portainer
  hosts: homelab
  become: true

  vars_files:
    - ../../vars/global.yml

  vars:
    https_port: 9443

  tasks:
    - name: Add docker base folder.
      file:
        path: "{{ base_dir }}"
        state: directory
        mode: '0755'
        owner: prouser 
        group: prouser

    - name: Add portainer data folder
      file:
        path: "{{ base_dir }}/portainer"
        state: directory
        mode: '0755'
        owner: prouser 
        group: prouser

    - name: Download portainer image
      community.docker.docker_image:
        name: portainer/portainer-ce:latest
        source: pull

    - name: Start portainer Container
      community.docker.docker_container:
        name: portainer
        image: portainer/portainer-ce:latest
        state: "{{ container_state }}"
        restart_policy: always
        recreate: true
        networks:
          - name: traefik_net # thêm mạng lan ảo mới
        ports:
           #- "8000:8000"
           #- "127.0.0.1:{{ http_port }}:{{ http_port }}"
           - "127.0.0.1:9443:9443"
        labels:
          "traefik.enable": "true"
          "traefik.http.routers.portainer.rule": "Host(`portainer.homelab.local`)"
          "traefik.http.services.portainer.loadbalancer.server.port": "9000"
          "traefik.http.routers.portainer.entrypoints": "web"
        volumes:
          - "/var/run/docker.sock:/var/run/docker.sock"
          - "{{ base_dir }}/portainer:/data"
        command: 
          - "--http-enabled"