---
- name: Deploy Traefik with Docker Network
  hosts: homelab
  become: true

  vars_files:
    - ../../vars/global.yml

  vars:
    traefik_base_dir: "{{ base_dir }}/docker-data/traefik"
    traefik_config_dir: "{{ base_dir }}/traefik/config"
    # Tên mạng LAN ảo phải khớp với các container khác (Portainer/Qbit)
    docker_network_name: "traefik_net" 

  tasks:
    # 1. TẠO MẠNG ẢO (Bước quan trọng nhất)
    - name: Create custom Docker network
      community.docker.docker_network:
        name: "{{ docker_network_name }}"
        driver: bridge
      check_mode: no 

    # 2. Tạo thư mục config
    - name: Ensure Traefik config directories exist
      file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
        owner: "prouser"
        group: "prouser"
      loop:
        - "{{ traefik_base_dir }}"
        - "{{ traefik_config_dir }}"

    # 3. Tạo file Config Động (Dynamic Config)
    # Lưu ý: Ta KHÔNG còn map Portainer/Qbit ở đây nữa vì đã dùng Labels.
    # File này giữ lại để bạn có thể thêm Middleware hoặc TLS config sau này.
    - name: Create basic dynamic config file
      copy:
        dest: "{{ traefik_config_dir }}/dynamic_conf.yml"
        owner: "prouser"
        group: "prouser"
        mode: '0644'
        content: |
          http:
            middlewares:
              # Ví dụ: Middleware nén gzip (có thể dùng cho các container khác)
              my-compress:
                compress: {}

    # 4. Pull Image
    - name: Pull Traefik Docker image
      community.docker.docker_image:
        name: traefik:latest
        source: pull

    # 5. Chạy Container
    - name: Run Traefik container
      community.docker.docker_container:
        name: traefik
        image: traefik:latest
        state: started
        restart_policy: unless-stopped
        
        # --- CẤU HÌNH MẠNG MỚI ---
        networks:
          - name: "{{ docker_network_name }}"
        
        # Chỉ mở những port cần thiết ra ngoài Host
        ports:
          - "80:80"       # HTTP
          - "127.0.0.1:8081:8081"   # Traefik Dashboard (Nếu dùng api.insecure)
          # - "443:443"   # Uncomment sau này nếu dùng HTTPS
        
        volumes:
          - "/var/run/docker.sock:/var/run/docker.sock:ro"
          - "{{ traefik_config_dir }}:/etc/traefik/config:ro"
        
        # --- KHÔNG CẦN LABELS CHO CHÍNH NÓ (VÌ DASHBOARD ĐÃ MỞ PORT 8081) ---
        
        command:
          # Bật Dashboard xem cho dễ (truy cập qua port 8081)
          - "--api.insecure=true"
          - "--api.dashboard=true"
          
          # Cấu hình Docker Provider (Cốt lõi của việc tự động hóa)
          - "--providers.docker=true"
          - "--providers.docker.exposedbydefault=false"
          # BẮT BUỘC: Chỉ định mạng để Traefik biết đường tìm IP (tránh lấy nhầm IP lớp 172.17.x.x)
          - "--providers.docker.network={{ docker_network_name }}"
          
          # Cấu hình File Provider (Để đọc file dynamic_conf.yml vừa tạo)
          - "--providers.file.directory=/etc/traefik/config"
          - "--providers.file.watch=true"
          
          # Entrypoints
          - "--entrypoints.web.address=:80"
          
          # Logging
          - "--log.level=INFO"
          - "--accesslog=true"

    # 6. Kiểm tra
    - name: Verify Traefik is listening on port 80
      wait_for:
        port: 80
        delay: 2
        timeout: 30