---
- name: Deploy Cloudflare Tunnel
  hosts: homelab
  become: true

  vars_files:
    - ../../vars/secrets.yml
    - ../../vars/global.yml
  vars:
    docker_network_name: "cloudflared_net"
    network_subnet: "172.18.0.0/16"
    network_gateway: "172.18.0.1"

  tasks:
    - name: Check if Docker network exists
      community.docker.docker_network_info:
        name: "{{ docker_network_name }}"
      register: cloudflared_net_info

    - name: Create Docker network
      community.docker.docker_network:
        name: "{{ docker_network_name }}"
        driver: bridge
        ipam_config:
          - subnet: "{{ network_subnet }}"
            gateway: "{{ network_gateway }}"
        state: present
      when: not cloudflared_net_info.exists

    - name: Run Cloudflare Tunnel container
      community.docker.docker_container:
        name: cloudflared
        image: cloudflare/cloudflared:latest
        state: "{{ container_state }}"
        restart_policy: unless-stopped
        pull: always # luôn pull image mới khi chạy playbook này
        recreate: true # luôn tạo container mới khi chạy playbook
        command: tunnel run
        env:
          TUNNEL_TOKEN: "{{ cloudflare_tunnel_token }}"
        
        networks:
          - name: cloudflared_net