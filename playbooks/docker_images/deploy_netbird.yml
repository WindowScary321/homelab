---
- name: Deploy netbird client
  hosts: homelab
  become: true
  
  vars_files:
    - ../../vars/secrets.yml

  vars:
    base_dir: "/home/prouser/docker-data"
    container_state: started
    peer_name: "homelab"

  tasks:
    - name: Create Netbird directory
      file:
        path: "{{ base_dir }}/netbird"
        state: directory
        mode: '0700'
        owner: prouser
        group: prouser

    - name: Download Netbird image
      community.docker.docker_image:
        name: netbirdio/netbird:latest
        source: pull

    - name: Start Netbird Container
      community.docker.docker_container:
        name: netbird-client
        image: netbirdio/netbird:latest
        state: "{{ container_state }}"
        restart_policy: always
        hostname: "{{ peer_name }}"
        capabilities:
          - NET_ADMIN
          - SYS_ADMIN
          - SYS_RESOURCE
        env:
          NB_SETUP_KEY: "{{ netbird_setup_key }}"
        volumes:
          - "{{ base_dir }}/netbird:/var/lib/netbird"
        network_mode: host