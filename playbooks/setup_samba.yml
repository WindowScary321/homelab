---
- name: Setup Samba Share on Homelab
  hosts: homelab
  become: true
  
  vars_files:
    - ../vars/secrets.yml
    - ../vars/global.yml

  vars:
    samba_user: "{{ homelab_user }}"
    share_path: /mnt/data
    share_name: Data

  tasks:
    - name: Install Samba package
      apt:
        name: samba
        state: present
        update_cache: yes

    - name: Ensure shared directory exists and has correct permissions
      file:
        path: "{{ share_path }}"
        state: directory
        owner: "{{ samba_user }}"  
        group: "{{ samba_user }}"
        mode: '0775'

    - name: Configure Samba share in smb.conf
      blockinfile:
        path: /etc/samba/smb.conf
        marker: "# {mark} ANSIBLE MANAGED BLOCK {{ share_name }}"
        block: |
          [{{ share_name }}]
          path = {{ share_path }}
          writeable = yes
          browsable = yes
          public = no
          valid users = {{ samba_user }}
          create mask = 0664
          directory mask = 0775
          force user = {{ samba_user }}
      notify: Restart Samba

    - name: Check if Samba user already exists
      shell: pdbedit -L {{ samba_user }}
      register: samba_user_check
      failed_when: false
      changed_when: false

    - name: Create or update Samba user password
      command: smbpasswd -s -a {{ samba_user }}
      stdin: "{{ smb_password }}\n{{ smb_password }}"
      no_log: true
      changed_when: samba_user_check.rc != 0 # chỉ báo changed khi tạo user mới

  handlers:
    - name: Restart Samba 
      service:
        name: smbd
        state: restarted
        enabled: yes