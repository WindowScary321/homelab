---
- name: Deploy portainer
  hosts: homelab
  become: true

  vars:
    base_dir: "/home/prouser/docker-data" # sẽ cài các docker image vào thư mục này
    container_state: started # bật tắt container bằng biến này 

  tasks:
    - name: 1. Add docker base folder.
      file:
        path: "{{ base_dir }}"
        state: directory
        mode: '0755'
        owner: prouser # Cho phép t truy cập vào folder này
        group: prouser

    - name: 2. Add portainer data folder
      file:
        path: "{{ base_dir }}/portainer"
        state: directory
        mode: '0755'
        owner: prouser 
        group: prouser

    - name: 3. Download portainer image
      community.docker.docker_image:
        name: portainer/portainer-ce:lts
        source: pull

    - name: 4. Start portainer 
      community.docker.docker_container:
        name: portainer
        image: portainer/portainer-ce:lts
        state: "{{ container_state }}"
        restart_policy: always
        ports:
          - "8000:8000"
          - "9443:9443"
        volumes:
          - "/var/run/docker.sock:/var/run/docker.sock"
          - "{{ base_dir }}/portainer:/data"