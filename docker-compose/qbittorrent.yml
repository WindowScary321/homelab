services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    networks:
      - cloudflared_net
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Ho_Chi_Minh
      - WEBUI_PORT=9067
      - TORRENTING_PORT=54782
    volumes:
      - /opt/docker-data/qbittorrent:/config
      - /mnt/data/torrents:/downloads
      - /home/prouser/Downloads:/downloads1
    ports:
      - 9067:9067
      - 54782:54782
      - 54782:54782/udp
    labels:
      - com.centurylinklabs.watchtower.enable=true
networks:
  cloudflared_net:
    external: true