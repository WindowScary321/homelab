services:
  wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: wireguard
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Ho_Chi_Minh
      - SERVERURL=auto
      - SERVERPORT=123
      - PEERS=laptop,pc,mobile
      - PEERDNS=auto
      - INTERNAL_SUBNET=10.13.13.0
      - ALLOWEDIPS=0.0.0.0/0
      - LOG_CONFS=true
    ports:
      - 123:51820/udp # đổi port để né firewall của trường
    volumes:
      - /opt/docker-data/wireguard:/config
      - /lib/modules:/lib/modules:ro
    labels:
      - com.centurylinklabs.watchtower.enable=true 