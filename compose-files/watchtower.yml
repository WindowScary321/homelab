services:
  watchtower: 
    image: nickfedor/watchtower:latest # containrrr (chủ dự án cũ) đã archive repo, đổi sang fork mới hơn
    container_name: watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/localtime:/etc/localtime:ro
    environment:
      - WATCHTOWER_CLEANUP=true # xoá image cũ sau khi update
      - WATCHTOWER_SCHEDULE=0 0 4 * * *  # 4h sáng mỗi ngày (utc +7)
      - WATCHTOWER_ROLLING_RESTART=true # restart từng container thay vì tất cả cùng lúc
      - WATCHTOWER_TIMEOUT=60 # chờ 1p sau khi container tắt
      - WATCHTOWER_LABEL_ENABLE=true # chỉ update các container có label 
      - WATCHTOWER_INCLUDE_RESTARTING=true # monitor cả container đang restart
    labels:
      - "com.centurylinklabs.watchtower.enable=false" # ko cho watchtower tự update
    command:
      - --cleanup=true 