services:
  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    user: 1000:1000
    restart: unless-stopped
    ports:
      - 4533:4533
    volumes:
      - /opt/docker-data/navidrome:/data
      - "/home/prouser/Music/Poweramp songs:/music:ro"
    networks:
      - cloudflared_net
    labels:
      - com.centurylinklabs.watchtower.enable=true
    environment:
      - ND_LASTFM_APIKEY=295f415d1782fd558ae32ca99c6f40b1         
      - ND_LASTFM_SECRET=34344b1bd911241da899875c883d0976           
      - ND_LOGLEVEL=info

networks:
  cloudflared_net:
    external: true