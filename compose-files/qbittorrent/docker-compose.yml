services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    networks:
      - cloudflared_net
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Ho_Chi_Minh
      - WEBUI_PORT=8080
      - DOCKER_MODS=ghcr.io/vuetorrent/vuetorrent-lsio-mod:latest
    volumes:
      - /home/prouser/docker-data/qbittorrent/config:/config
      - /mnt/data/torrents:/downloads
    ports:
      - 54782:54782
      - 54782:54782/udp
    labels:
      - "com.centurylinklabs.watchtower.enable=true" # auto update container bằng watchtower

networks: # add thí shit
  cloudflared_net:
    external: true
