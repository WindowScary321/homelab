services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    networks:
      - traefik_net
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Ho_Chi_Minh
      - WEBUI_PORT=8080
      - DOCKER_MODS=ghcr.io/vuetorrent/vuetorrent-lsio-mod:latest
    volumes:
      - /home/prouser/docker-data/qbittorrent/config:/config
      - /mnt/data/torrents:/downloads
    ports:
      # - 127.0.0.1:8080:8080 # bỏ port này, traffic webui đi qua traefik
      - 54782:54782
      - 54782:54782/udp
    labels:        
      - "traefik.enable=true"
      - "traefik.http.routers.qbittorrent.rule=Host(`qbit.homelab.local`)"
      - "traefik.http.services.qbittorrent.loadbalancer.server.port=8080"
      - "traefik.http.routers.qbittorrent.entrypoints=web"
    restart: unless-stopped

networks: # add thí shit
  traefik_net:
    external: true
